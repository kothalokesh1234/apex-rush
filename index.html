<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apex Rush — Top-Down Racing</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="wrap">
    <header id="hud-top">
      <div class="brand">APEX <span>RUSH</span></div>
      <div class="hud-stats">
        <div class="stat"><label>SPEED</label><b id="speed">0</b><small>km/h</small></div>
        <div class="stat"><label>LAP</label><b id="lap">1/3</b></div>
        <div class="stat"><label>POS</label><b id="pos">P4</b></div>
        <div class="stat"><label>TIME</label><b id="time">0:00.0</b></div>
      </div>
    </header>

    <div id="stage">
      <canvas id="game" width="960" height="600"></canvas>

      <div id="overlay" class="show">
        <div class="panel">
          <h1>APEX <span>RUSH</span></h1>
          <p class="tag">3 laps &bull; 4 racers &bull; one winner</p>
          <div class="controls">
            <div><kbd>&uarr;</kbd><kbd>&darr;</kbd> throttle / brake</div>
            <div><kbd>&larr;</kbd><kbd>&rarr;</kbd> steer</div>
            <div><kbd>R</kbd> reset &nbsp;&nbsp; <kbd>P</kbd> pause</div>
          </div>
          <button id="startBtn">Start Race</button>
        </div>
      </div>

      <div id="countdown"></div>
      <div id="toast"></div>
    </div>

    <footer id="hud-bottom">
      <span>Beat Blaze, Viper &amp; Storm to the finish line.</span>
      <span id="wrongway" class="hidden">WRONG WAY!</span>
    </footer>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
